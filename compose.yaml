services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: career_quest
      POSTGRES_USER: career_quest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - career_quest_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career_quest -d career_quest"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports:
      - "3000:3001"
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: career_quest
      PGUSER: career_quest
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PORT: 3001
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      HR_ACCESS_CODE: ${HR_ACCESS_CODE:?Set HR_ACCESS_CODE in .env}
    depends_on:
      db:
        condition: service_healthy
volumes:
  career_quest_db:
